<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Résumés post-journée — MPG Privé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --blue:#4054CC; --green:#45C945; --red:#C0303A;
  --grad:linear-gradient(135deg,#4054CC 0%,#45C945 100%);
  --bg:#F4F6F8; --surface:#FFFFFF; --border:#D8DAE8;
  --text:#1A1F2E; --muted:#959DAF;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);}

header{background:var(--grad);padding:40px 24px 48px;text-align:center;position:relative;overflow:hidden;}
header::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 70% 50%,rgba(255,255,255,.08) 0%,transparent 60%);}
.hbadge{display:inline-block;background:rgba(255,255,255,.2);color:#fff;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:4px 14px;border-radius:20px;margin-bottom:14px;}
header h1{font-size:clamp(24px,4vw,40px);font-weight:900;color:#fff;letter-spacing:-.5px;}
header p{margin-top:10px;font-size:15px;color:rgba(255,255,255,.8);font-weight:600;}

main{max-width:860px;margin:-20px auto 40px;padding:0 24px;position:relative;z-index:1;}

.recap-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:14px;box-shadow:0 2px 8px rgba(64,84,204,.06);}
.recap-meta{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:6px;}
.recap-meta .recap-gw{background:var(--blue);color:#fff;padding:2px 10px;border-radius:14px;font-size:12px;letter-spacing:0;}
.recap-title{font-size:18px;font-weight:900;line-height:1.25;color:var(--text);margin-bottom:8px;}
.recap-body{font-size:13px;line-height:1.55;color:var(--text);}
.recap-body ul{padding-left:0;list-style:none;}
.recap-body li{padding:3px 0;border-bottom:1px dashed rgba(0,0,0,.06);}
.recap-body li:last-child{border-bottom:none;}
.recap-body strong{font-weight:800;}

.empty{text-align:center;padding:60px 20px;color:var(--muted);font-weight:600;}

footer{text-align:center;padding:28px;font-size:13px;color:var(--muted);font-weight:600;}
footer a{color:var(--blue);text-decoration:none;font-weight:700;}
footer span{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:800;}
</style>
</head>
<body>
<header>
  <div class="hbadge">Archives</div>
  <h1>Résumés post-journée</h1>
  <p>Tous les résumés de journées passées</p>
</header>

<main id="recapsMain"></main>

<footer>
  <a href="index.html">Accueil</a> · <span>MPG Assistant</span>
</footer>

<script>
const RECAPS=[{"season":2025,"division_id":"mpg_division_QU0SUZ6HQPB_18_1","slabel":"S18","game_week":12,"title":"Manu et Raph se sauvent mutuellement à la Zahia","summary_html":"<ul>\n<li>🤝 <strong>Manu</strong> et <strong>Raph</strong> ont tous les deux sorti Zahia l'un contre l'autre — résultat : 4-4, les deux sauvés d'une défaite. Symbiose totale, ou fainéantise tactique ?</li>\n<li>🎯 Coup de bol ou génie ? Sans leurs bonus respectifs, les deux perdaient. Deux boulets qui se noient ensemble et remontent à la surface.</li>\n<li>💥 <strong>Damien</strong> atomise <strong>Greg</strong> 4-1 — la claque la plus propre de la journée, Greg peut aller se cacher jusqu'à la J13.</li>\n<li>🔥 <strong>François</strong> est à 11 matchs sans défaite, à UNE longueur de son record perso de 12. Encore un nul et il s'égalise lui-même — fascinant.</li>\n</ul>","generated_at":"2026-05-10T10:24:46.708277+00:00"}];
(function() {
  const main = document.getElementById('recapsMain');
  if (!RECAPS.length) {
    main.innerHTML = '<div class="empty">Aucun résumé en archive pour le moment.</div>';
    return;
  }
  main.innerHTML = RECAPS.map(r => `
    <article class="recap-card">
      <div class="recap-meta">
        <span class="recap-gw">J${r.game_week} ${r.slabel}</span>
        <span>${r.season}</span>
      </div>
      <h2 class="recap-title">${escapeHtml(r.title)}</h2>
      <div class="recap-body">${r.summary_html}</div>
    </article>
  `).join('');
})();
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}
</script>
</body>
</html>
